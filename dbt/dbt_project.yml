name: clinic_lakehouse
version: "1.0.0"
config-version: 2
profile: clinic_lakehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  clinic_lakehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

# Iceberg sources are registered in a "bronze" schema; creating it up front avoids
# a race when several threads load sources at once.
on-run-start:
  - "create schema if not exists bronze"
